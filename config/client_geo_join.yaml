# Example pipeline config — see PLAN.md section 4 for the target UX.
sources:
  clients:
    conn: postgresql://user:password@host:5432/warehouse
    table: clients
    key: postal_code
    key_type: postal_code
  geo:
    conn: postgresql://user:password@host:5432/geo
    table: fsa_lookup
    key: fsa
    key_type: fsa

join:
  match_threshold: 0.95
  fuzzy_fallback: true

target_column: churned      # omit to skip feature flagging
time_column: signup_date    # optional, enables temporal leakage checks

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-audit-toolkit"
version = "0.1.0"
description = "Config-driven data join, schema validation, and feature audit pipeline with report artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pandas>=2.0",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "datacompy>=0.10",
    "recordlinkage>=0.15",
    "pandera>=0.18",
    "feature-engine>=1.6",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

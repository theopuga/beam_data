[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-audit-toolkit"
version = "0.1.0"
description = "Config-driven data join, schema validation, and feature audit pipeline with report artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pandas>=2.0",
    "scipy>=1.10,<1.16",  # 1.16+ wheel DLLs blocked by local Application Control policy (WDAC); revisit if IT allowlists
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "datacompy>=1.0",
    "recordlinkage>=0.15",
    "pandera>=0.33",
    "feature-engine>=1.6",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.0",  # required by pandera.io to_script (schema auto-draft)
]
# DBAPI drivers — SQLAlchemy needs one per engine; install via extras flag.
# e.g. pip install -e ".[postgresql]"  (CI tests the SQL path with sqlite)
postgresql = ["psycopg2-binary>=2.9"]
snowflake = ["snowflake-sqlalchemy>=1.6"]
mssql = ["pyodbc>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# TRY004: malformed config content raises ValueError uniformly, not TypeError
ignore = ["TRY004"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localdb"
version = "0.1.0"
description = "Query already-downloaded data files (CSV/Parquet/Excel/JSON/SQLite) as a local database"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14.0"]
excel = ["openpyxl>=3.1"]
sql = ["duckdb>=1.0"]
fuzzy = ["rapidfuzz>=3.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# TRY004: malformed config/catalog content raises ValueError uniformly, not TypeError
ignore = ["TRY004"]
